# Core scale ranges of the Flatiron Institute centers
# ===================================================
#
# One [[center]] table per center, listed from the smallest to the largest
# systems studied. The figure legend uses this order.
#
# Geometry
#   length = [min, max]   log10 of characteristic length in meters
#   time   = [min, max]   log10 of characteristic time in seconds
#
#   A center's region in the figure is this box clipped to the causal
#   half-plane t >= L/c, i.e. log10 t >= log10 L - log10 c (log10 c = 8.4768).
#   The clipping is done in code (scalemap/data.py), so only the box
#   lives here. See docs/methodology.md for why.
#
#   A center with kind = "methods" has no box. It is drawn as an L-shaped band
#   along both axes, every length and every time (CCM builds tools used at
#   every scale).
#
# Style
#   color        wash and outline hue
#   label_color  darker shade of the same hue, used for text
#   wash_alpha   fill opacity, tuned per hue so every wash lands at about the
#                same lightness on white (dark hues get a lower alpha)
#
# Provenance
#   smallest / largest / fastest / slowest describe what sets each bound.
#   They are judgment calls about each center's *core* research program,
#   made from the centers' public pages (url) in October 2026. They are not
#   official numbers. Edge cases that were considered and left out of the
#   core ranges are listed in extensions.toml.

[[center]]
id          = "CCQ"
name        = "Center for Computational Quantum Physics"
short_name  = "Quantum Physics"
kind        = "region"
length      = [-10.5, -7.5]
time        = [-18.0, -11.0]
color       = "#A86BDB"
label_color = "#6B3A9E"
wash_alpha  = 0.17
smallest    = "electron orbitals and crystal unit cells (~0.3 Å)"
largest     = "moiré superlattices (~30 nm)"
fastest     = "attosecond electron dynamics"
slowest     = "picosecond relaxation (plus equilibrium properties)"
url         = "https://www.simonsfoundation.org/flatiron/center-for-computational-quantum-physics/"

